# workbuddy-api · Docker Compose（直接拉 GitHub Actions 构建好的镜像，最省事）
#
# 用法：
#   1) 改掉下面 3 处 ★必改
#   2) docker compose -f docker-compose.image.yml up -d
#   3) 浏览器打开 http://<主机IP>:7863/ ，用 WILDWORK_ADMIN_PASSWORD 登录添加账号
#
# 本文件与另外两份 compose 的分工：
#   本文件                  直接拉 ghcr.io 上的现成镜像，不构建 → 适合 NAS / 生产。
#   docker-compose.yml      （仓库根）本地从源码构建，适合开发机 / 想改代码。
#   docker/docker-compose.yml（docker/ 目录）NAS 离线包用，要求事先交叉编译二进制。
#
# 镜像由 .github/workflows/docker.yml 在推 main / 打 v* tag 时自动构建并推送，
# 架构 linux/amd64 + linux/arm64。当前标签：
#   latest          ← main 分支最新（本文件用的就是这个）
#   0.1.2 / 0.1     ← 打 v0.1.2 tag 时
#   sha-ed32ccb     ← 每次提交，回滚到具体 commit 用
# 想固定版本就把下面 image 改成 ghcr.io/kongbai333/workbuddy-api:0.1.2 之类。

services:
  workbuddy-api:
    image: ghcr.io/kongbai333/workbuddy-api:latest
    container_name: workbuddy-api
    # 容器异常退出自动重启；手动 stop 后不会自己起来
    restart: unless-stopped

    environment:
      # 容器内必须监听全部网卡（不能写 127.0.0.1，否则宿主访问不到）。
      # 注意：非环回监听会**强制要求**管理密码，见下面的 ADMIN_PASSWORD。
      WILDWORK_LISTEN: ":7863"

      # ★必改 1/3 强随机管理密码（Web 面板登录口令）。
      #   留空 + 对外监听 = 程序直接拒绝启动 —— 这是有意的，
      #   防止把端口映射到局域网却忘了设密码（面板可增删账号、退出进程）。
      #   生成：head -c 18 /dev/urandom | base64 | tr -d '/+='
      WILDWORK_ADMIN_PASSWORD: "CHANGE_ME_admin_pass"

      # ★必改 2/3 OpenAI 兼容接口的 Bearer 密钥。
      #   留空 = 接口无鉴权，任何能访问该端口的人都能消耗你的账号额度。
      #   生成：head -c 32 /dev/urandom | base64 | tr -d '/+='
      WILDWORK_API_KEY: "CHANGE_ME_strong_api_key"

      # 账号目录与状态文件（容器内路径，对应下面 volumes 的挂载点）
      WILDWORK_AUTH_DIR: "/data/auths"
      WILDWORK_STATE_FILE: "/data/state.json"

      # 区域：cn = 国内版
      WILDWORK_REGION: "cn"

      # 时区（影响定时签到的触发时刻）。二进制已内嵌 tzdata，此设置一定生效。
      TZ: "Asia/Shanghai"

      # ── 可选参数，按需取消注释 ────────────────────────────────
      # 冷却策略
      # WILDWORK_HARD_CREDIT: "12h"      # 余额/权益不足 → 整号冷却多久
      # WILDWORK_SOFT_RATE: "60s"        # 被限流 → 软冷却多久
      # WILDWORK_ERR_THRESHOLD: "3"      # 连续错误几次进入冷却
      # WILDWORK_ERR_COOLDOWN: "10m"     # 错误冷却时长
      # 上游单次请求超时（秒）
      # WILDWORK_TIMEOUT_SECONDS: "120"

      # ── 成长中心自动化（★默认全关）────────────────────────────
      # ⚠️ 开启会**真实改变账号状态**：兑换消耗连登档位、抽奖次数用掉不可撤销。
      #    建议先在面板里手动触发一两次确认结果，再打开自动执行。
      # WILDWORK_GROWTH_REDEEM_STREAK: "true"   # 连登档位自动兑换 + 抽奖自动抽完
      # WILDWORK_GROWTH_TRAVEL: "true"          # 猫猫旅行自动派出 + 到站领取
      # WILDWORK_GROWTH_TRAVEL_LOCATION: "1"    # 目的地 1~4

    ports:
      # 「宿主机端口:容器端口」，容器端口固定 7863 不要改。
      # 左侧 7863 若被占用可改成比如 17863，之后访问也用新端口。
      - "7863:7863"

    volumes:
      # ★必改 3/3 左侧换成你机器上真实存在的持久化目录（不存在会自动创建）。
      #   ⚠️ 只挂「目录」，绝不挂单个文件 ——
      #      把 config.json 单文件挂进来时，宿主缺该文件，Docker 会建出一个
      #      同名空目录，程序读配置即崩（现象是容器 Exited:0）。
      - ./data:/data

    healthcheck:
      # 探针打容器内网卡；/healthz 无需鉴权，不用带 API Key
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7863/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # 日志轮转：防止长期运行把磁盘写满
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 让容器以非 root 运行更安全（如启用，需同步 chown 数据目录）
    # user: "1000:1000"
