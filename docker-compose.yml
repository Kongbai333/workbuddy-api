# workbuddy-api · Docker Compose（仓库根目录，源码构建版）
#
# 用法（干净 clone 即可，**不需要事先编译二进制**）：
#     cp docker/.env.example .env     # 然后把两个 ★必改 换成自己的强随机值
#     docker compose up -d
#     # 面板：http://<主机IP>:7863/
#
# 与 docker/docker-compose.yml 的分工：
#   本文件         构建上下文 = 仓库根目录，镜像内自己编译 Go 源码（见根目录 Dockerfile）。
#                  适合开发机、CI，以及「从源码起一套」的场景。
#   docker/ 下那份 构建上下文 = docker/ 目录，要求事先交叉编译出 docker/workbuddy-api，
#                  是给 NAS / 弱网环境准备的离线包，两者不要混用。
#
# 不想本地构建、直接用 GitHub Actions 产出的镜像（推荐给 NAS）：
#   image 换成 ghcr.io/kongbai333/workbuddy-api:latest，并删掉下面整个 build: 段。
#   细节见 docker/README.md「路径 A」。

services:
  workbuddy-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: workbuddy-api:latest
    container_name: workbuddy-api
    restart: unless-stopped

    environment:
      # 容器内必须监听全部网卡（不能写 127.0.0.1，否则宿主访问不到）。
      # 注意：非环回监听会**强制要求**管理密码，见下面的 ADMIN_PASSWORD。
      WILDWORK_LISTEN: ":7863"

      # ★必改 强随机管理密码（Web 面板登录口令）。
      #   留空 + 对外监听 = 程序直接拒绝启动（防局域网无凭据访问面板）。
      #   生成：head -c 18 /dev/urandom | base64 | tr -d '/+='
      WILDWORK_ADMIN_PASSWORD: "${WILDWORK_ADMIN_PASSWORD:-CHANGE_ME_admin_pass}"

      # ★必改 OpenAI 兼容接口的 Bearer 密钥。留空 = 接口无鉴权，任何人可消耗你的账号额度。
      WILDWORK_API_KEY: "${WILDWORK_API_KEY:-CHANGE_ME_strong_api_key}"

      # 账号目录与状态文件（容器内路径，对应下面 volumes 的挂载点）
      WILDWORK_AUTH_DIR: "/data/auths"
      WILDWORK_STATE_FILE: "/data/state.json"

      # 区域：cn = 国内版
      WILDWORK_REGION: "cn"

      # 时区（影响定时签到的触发时刻）。二进制已内嵌 tzdata，此设置一定生效。
      TZ: "Asia/Shanghai"

      # ── 可选参数，按需取消注释 ────────────────────────────────
      # 冷却时长
      # WILDWORK_HARD_CREDIT: "12h"      # 余额/权益不足
      # WILDWORK_SOFT_RATE: "60s"        # 被限流
      # WILDWORK_ERR_THRESHOLD: "3"      # 累计错误几次进入冷却
      # WILDWORK_ERR_COOLDOWN: "10m"     # 错误冷却时长
      # 上游超时
      # WILDWORK_TIMEOUT_SECONDS: "120"

      # ── 成长中心自动化（默认关闭；开启会真实改变账号状态）────────
      # WILDWORK_GROWTH_REDEEM_STREAK: "true"   # 连登档位自动兑换 + 抽奖次数自动抽完
      # WILDWORK_GROWTH_TRAVEL: "true"          # 猫猫旅行自动派出 + 到站领取
      # WILDWORK_GROWTH_TRAVEL_LOCATION: "1"    # 目的地 1~4

    ports:
      - "7863:7863"

    volumes:
      # 只挂「目录」，绝不挂单个文件 ——
      # 旧项目曾把 config.json 单文件挂进来，宿主缺该文件时 Docker 会建出一个
      # 同名空目录，导致容器启动即崩。
      - ./data:/data

    healthcheck:
      # 探针打容器内网卡；/healthz 无需鉴权，不用带 API Key
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7863/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # 日志轮转：防止长期运行把磁盘写满
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
